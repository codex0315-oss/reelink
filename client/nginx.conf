# Replaces nginx's default site. Traefik terminates TLS in front of this, so there is
# no SSL here — only plain HTTP on port 80 inside the container.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the version in responses or on error pages.
  server_tokens off;

  # The mp4s under public/ are already compressed; gzipping them burns CPU and saves
  # nothing, so the type list is text only.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/xml;

  # Vite writes a content hash into every filename here, so the name changes whenever
  # the contents do. That makes a one-year immutable cache both safe and worth having,
  # since these are the largest files on the critical path.
  #
  # `=404` rather than the SPA fallback below: a stale index.html asking for a script
  # that no longer exists must get a 404, not a page of HTML. Falling back would hand
  # the browser HTML where it expected JavaScript, and the only symptom is
  # "Unexpected token '<'" on a white screen.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything copied from public/ keeps the name it was given — templates/luxury.mp4
  # stays templates/luxury.mp4 forever. An immutable cache here would mean replacing a
  # template video and having nobody ever see the new one. An hour, revalidated, is the
  # compromise: cheap on repeat views, and a swap goes live the same day.
  location ~* \.(mp4|webm|png|jpe?g|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # The entry point names the hashed bundles, so a cached copy points at files a later
  # deploy has already deleted. It has to be revalidated every time.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # React Router owns /listings/abc123 and /admin — paths with no file behind them.
  # Without this, a hard refresh on any route but / returns nginx's own 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
